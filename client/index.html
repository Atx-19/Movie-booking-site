<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movies — Movie Ticket Booking System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="navbar-placeholder"></div>

    <main class="main-container">
        <header class="page-header">
            <h1>Now Showing in Cinemas</h1>
            <p>Select a blockbuster to explore screens, show timings, and book seats.</p>
        </header>

        <section class="filters-bar">
            <input type="text" id="searchInput" class="search-input" placeholder="🔍 Search movies by title or plot...">
            <select id="genreFilter" class="filter-select">
                <option value="">All Genres</option>
            </select>
        </section>

        <section id="movieGrid" class="movie-grid">
            <!-- Dynamic Movie Cards Loaded via JS -->
            <p style="color: var(--text-muted);">Loading movies from database...</p>
        </section>
    </main>

    <footer class="footer">
        <p>DBMS Project — Movie Ticket Booking System with Raw MySQL & Express</p>
    </footer>

    <script src="js/api.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/movies.js"></script>
</body>
</html>
